name: college_app
description: A college community app
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6

  # ================= FIREBASE =================
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.0
  cloud_firestore: ^5.5.0

  # ================= GOOGLE SIGN IN =================
  google_sign_in: ^6.2.1

  # ================= SUPABASE (STORAGE ONLY) =================
  supabase_flutter: ^2.5.0

  # ================= MEDIA / STORAGE =================
  image_picker: ^1.1.2

  # ================= MOMENTS (SNAPCHAT STYLE) =================
  # kMomentsEnabled in feed_screen.dart is false — feature restored but
  # not user-reachable (see git history for why: don't re-remove these
  # as "unused" without checking that flag first).
  camera: ^0.11.0+2
  video_player: ^2.8.1


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true