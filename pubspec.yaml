name: college_app
description: A college community app
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6

  # ================= TYPOGRAPHY =================
  # theme.dart declared 'SF Pro Display' but no such font was ever bundled
  # (no assets/fonts, no fonts: section below) -- it silently fell back to
  # the platform default the whole time. google_fonts is the standard,
  # lightweight way to ship a deliberate type pairing (Sora display / Inter
  # body) without hand-bundling .ttf files; it fetches once and caches on
  # device, with a system-font fallback while a face is first loading.
  google_fonts: ^6.2.1

  # ================= GOOGLE SIGN IN =================
  # Native sign-in only now -- Supabase Auth's signInWithIdToken takes the
  # resulting token (see lib/auth/screens/login_screen.dart). No firebase_auth.
  google_sign_in: ^6.2.1

  # ================= SUPABASE =================
  # Primary backend: Auth, Postgres (all app data), Storage, Realtime.
  # See docs/supabase-migration-*.md for the full migration record.
  supabase_flutter: ^2.5.0

  # ================= MEDIA / STORAGE =================
  image_picker: ^1.1.2

  # ================= MOMENTS (SNAPCHAT STYLE) =================
  # kMomentsEnabled in feed_screen.dart is false — feature restored but
  # not user-reachable (see git history for why: don't re-remove these
  # as "unused" without checking that flag first).
  camera: ^0.11.0+2
  video_player: ^2.8.1


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true