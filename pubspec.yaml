name: college_app
description: A college community app
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6

  # ================= FIREBASE =================
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.0
  cloud_firestore: ^5.5.0

  # ================= GOOGLE SIGN IN =================
  google_sign_in: ^6.2.1

  # ================= SUPABASE (STORAGE ONLY) =================
  supabase_flutter: ^2.5.0

  # ================= MEDIA / STORAGE =================
  image_picker: ^1.1.2

  # ================= MOMENTS (SNAPCHAT STYLE) =================
  camera: ^0.11.0+2

  video_player: ^2.8.1
  path_provider: ^2.1.4
  firebase_messaging: ^15.0.0




dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true